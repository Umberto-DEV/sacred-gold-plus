name: Public checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  public-files:
    name: Public files and release fingerprints
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the public repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'

      - name: Check public files and release/1.2 fingerprints
        run: python .github/check_public.py

      - name: Rebuild the release ZIPs from the checked files
        run: python3 -B release/1.2/build_zip.py
