name: Public checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  public-checks:
    name: Public files and synthetic tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the public repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'

      - name: Check public files and patch fingerprints
        run: python .github/check_public.py

      - name: Install the declared test dependency
        run: python -m pip install --disable-pip-version-check -r source/requirements.txt

      - name: Run synthetic tests
        run: python -m unittest discover -s source/translation -p 'test_*.py' -v

      - name: Set up Node for the offline installer tests
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.0'

      - name: Test the offline installer without game files
        run: node --test source/installer/test_worker.cjs
