name: Public checks

# Every push on any branch and every pull request against main: the file
# contract and the Class A tests — the ones that need
# no game file. Nothing here builds a game: that needs the player's own file and
# happens only on a contributor's machine (see source/README.md).
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  public-files:
    name: Public files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the public repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check public files
        # This checker uses only the standard library. ubuntu-24.04 ships
        # /usr/bin/python3; avoid a network download for a second interpreter.
        run: |
          python3 --version
          python3 .github/check_public.py

  class-a-tests:
    name: Class A tests (no game file)
    # Class A exercises the observed Apple host toolchain. Keep every payload
    # byte-comparison and size gate; this is not production ROM reproduction.
    # Installed version/path: actions/runner-images/images/macos/xcode-27-arm64-Readme.md
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      # Use the installed protected CLT tree, not an Xcode release-candidate
      # alias. Its observed host identity is separate from the production pin.
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
    steps:
      - name: Check out the public repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'

      - name: Install the pinned tool dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r source/requirements.txt

      - name: Check the host C compiler can target the ARM946E-S
        # Native suites compile our own blobs for this target and execute them
        # under Unicorn. A missing host/ARM compiler is a failure, never a
        # reason to silently omit those tests.
        run: |
          pkgutil --pkg-info=com.apple.pkg.CLTools_Executables
          compiler=$(xcrun --find clang)
          export SDKROOT=$(xcrun --sdk macosx --show-sdk-path)
          echo "SDKROOT=$SDKROOT" >> "$GITHUB_ENV"
          "$compiler" --version
          "$compiler" -shared -fPIC -x c /dev/null -o "$RUNNER_TEMP/host-probe.dylib"
          shasum -a 256 "$compiler"
          echo "Nonproduction host contracts; production compiler pins remain separate"
          # Put this selected toolchain ahead of Homebrew for all Python subprocesses.
          dirname "$compiler" >> "$GITHUB_PATH"
          "$compiler" --target=armv5te-none-eabi -mcpu=arm946e-s -mthumb -ffreestanding \
                -c -x c /dev/null -o /dev/null
          echo "armv5te-none-eabi: usable; exact payload identity checked by the suites"

      - name: Run the Class A suites
        # SGP_CI=1 makes a missing ARM compiler a failure rather than a skip.
        env:
          SGP_CI: '1'
        run: python source/run_tests.py --json class-a-results.json

      - name: Upload the test counts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: class-a-results
          path: class-a-results.json
          if-no-files-found: warn
