name: Public checks

# Every push on any branch and every pull request against main: the file
# contract, the release fingerprints and the Class A tests — the ones that need
# no game file. Nothing here builds a game: that needs the player's own file and
# happens only on a contributor's machine (see DEVELOPMENT.md).
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  public-files:
    name: Public files and release fingerprints
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the public repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'

      - name: Check public files and release/1.2 fingerprints
        run: python .github/check_public.py

      - name: Rebuild the release ZIPs from the checked files
        run: python3 -B release/1.2/build_zip.py

  class-a-tests:
    name: Class A tests (no game file)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the public repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'

      - name: Install the pinned tool dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r source/requirements.txt

      - name: Report the C compiler used for the ARM blobs
        run: clang --version

      - name: Run the Class A suites
        run: python source/run_tests.py --json class-a-results.json

      - name: Upload the test counts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: class-a-results
          path: class-a-results.json
          if-no-files-found: warn
