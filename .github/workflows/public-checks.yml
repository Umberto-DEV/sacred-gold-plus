name: Public checks

# Every push on any branch and every pull request against main: the file
# contract and the Class A tests — the ones that need
# no game file. Nothing here builds a game: that needs the player's own file and
# happens only on a contributor's machine (see source/README.md).
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  public-files:
    name: Public files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the public repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.14'

      - name: Check public files
        run: python .github/check_public.py

  class-a-tests:
    name: Class A tests (no game file)
    # The shipped ARM payloads use Apple clang 21. Keep every byte-comparison
    # and size gate enabled; Ubuntu clang generates different code here.
    # Installed version/path: actions/runner-images/images/macos/xcode-27-arm64-Readme.md
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - name: Check out the public repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'

      - name: Install the pinned tool dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r source/requirements.txt

      - name: Check the C compiler can target the ARM946E-S
        # Not informational: two suites (95 tests) compile our own blobs for
        # this target and run them under an emulator. If the target is not
        # usable here, the job must say so instead of quietly skipping them.
        run: |
          xcodebuild -version
          compiler=$(xcrun --find clang)
          export SDKROOT=$(xcrun --sdk macosx --show-sdk-path)
          echo "SDKROOT=$SDKROOT" >> "$GITHUB_ENV"
          "$compiler" --version
          "$compiler" -shared -fPIC -x c /dev/null -o "$RUNNER_TEMP/host-probe.dylib"
          "$compiler" --version | head -n 1 | grep -E '^Apple clang version 21\.0\.0 '
          # Put this selected toolchain ahead of Homebrew for all Python subprocesses.
          dirname "$compiler" >> "$GITHUB_PATH"
          "$compiler" --target=armv5te-none-eabi -mcpu=arm946e-s -mthumb -ffreestanding \
                -c -x c /dev/null -o /dev/null
          echo "armv5te-none-eabi: usable; exact payload identity checked by the suites"

      - name: Run the Class A suites
        # SGP_CI=1 makes a missing ARM compiler a failure rather than a skip.
        env:
          SGP_CI: '1'
        run: python source/run_tests.py --json class-a-results.json

      - name: Upload the test counts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: class-a-results
          path: class-a-results.json
          if-no-files-found: warn
