name: Propose a source change
description: Optional early design discussion for developers; a separate issue is not required for a pull request.
title: "[Change] "
labels: [enhancement]
body:
  - type: textarea
    id: behaviour
    attributes:
      label: What should behave differently?
      description: One change, described from the player's side where it is visible from the player's side.
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Which part of the sources does it touch?
      description: "For example: source/sgp12/blocchi/, source/features/<name>/, source/translation/, source/docs/. See source/README.md."
    validations:
      required: true
  - type: dropdown
    id: reserve
    attributes:
      label: Does it need space in the ARM9 reserve?
      options: ["No", "Yes — I will claim it in source/docs/arm9-reserve-reservations.md", "I do not know yet"]
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: How would it be checked?
      description: Which ROM-free tests would catch a regression, and which private candidate and save-copy checks would verify it in-game? State what remains untested. See CONTRIBUTING.md.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I will not commit game files, game text, game code, extracted game data, saves, BIOS or raw device logs.
          required: true
